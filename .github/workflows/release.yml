name: Release

# Cross-platform release build, published to GitHub Releases and (if configured)
# itch.io.
#
# Triggered by pushing a tag like `v0.1.0`. To wire up itch.io publishing:
#   - set the repo variable ITCH_TARGET to your `user/game` itch.io slug
#   - set the repo secret BUTLER_API_KEY to an itch.io API key
#     (https://itch.io/user/settings/api-keys)
# Without both, the itch job is skipped and only the GitHub Release is created.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # Creates the release up front so the platform jobs have somewhere to upload
  # to. It stays a draft until every platform has succeeded, so a failed macOS
  # build can't leave a half-published release visible.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        id: create
        with:
          draft: true
          generate_release_notes: true

  # One job for all three desktop platforms. tauri-action builds, bundles
  # (deb/AppImage, msi/nsis, dmg) and uploads -- replacing the three
  # hand-written build jobs, the `lipo` universal step and the manual tar/zip
  # packaging the Bevy release workflow needed.
  desktop:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ''
          - os: windows-latest
            args: ''
          - os: macos-latest
            # One universal binary rather than separate Intel/ARM builds,
            # matching what the Bevy workflow produced via `lipo`.
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri's Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Add the macOS universal targets
        if: matrix.os == 'macos-latest'
        # Via `mise x --` so the targets land in the mise-pinned toolchain
        # rather than whatever rustc the runner ships with.
        run: mise x -- rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  web:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package archive
        run: (cd dist && zip -r ../tabletop-tavern-web.zip .)

      # Uploaded unzipped as well, because butler pushes a directory.
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: tabletop-tavern-web.zip

  publish-release:
    needs: [desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --draft=false

  itch-release:
    needs: web
    runs-on: ubuntu-latest
    if: vars.ITCH_TARGET != '' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/web

      - name: Push the web build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        # Only the html5 channel. The old workflow pushed four, but Tauri's
        # desktop output is installers (deb/msi/dmg) rather than the runnable
        # directories butler's linux/windows/mac channels expect -- publishing
        # those needs tauri build's raw binaries and is a follow-up.
        #
        # The secret is checked here rather than in `if:` above because job
        # conditions can't read secrets. The old workflow gated on ITCH_TARGET
        # alone, so a repo with the variable but no key failed on auth instead
        # of skipping.
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY is not set; skipping the itch.io publish."
            exit 0
          fi
          mise x -- butler push dist/web "${{ vars.ITCH_TARGET }}:html5" \
            --userversion "${{ github.ref_name }}"
