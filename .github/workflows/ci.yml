name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev pkg-config

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install rustfmt and clippy components
        # mise's rustup-provisioned toolchain doesn't install these by default on CI runners.
        run: mise x -- rustup component add rustfmt clippy

      - name: Check formatting
        run: mise x -- cargo fmt --all -- --check

      - name: Clippy
        run: mise x -- cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: mise x -- cargo test --all-targets

      - name: Build
        run: mise x -- cargo build --release
