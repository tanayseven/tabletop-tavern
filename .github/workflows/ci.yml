name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app itself is platform-independent, so this runs on Linux only. The old
  # three-OS matrix existed because the Bevy binary had to compile everywhere;
  # what actually varies per OS now is the Tauri shell, covered by `desktop`.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Handed to `deploy` rather than rebuilt there, so the artifact that ships
      # is byte-for-byte the one the e2e tests below ran against.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Catches breakage in the Tauri shell, which the `web` job never exercises.
  # Only builds the Rust side -- bundling is the release workflow's job.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri's Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      # tauri.conf.json points at ../dist, and `tauri build` would run it
      # anyway; building first keeps the failure attributable to the frontend.
      - name: Build the frontend
        run: pnpm build

      - name: Check the Tauri shell
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  # Publishes the web build to the S3 bucket behind tabletoptavern.tanay.tech.
  # The bucket, CloudFront distribution and IAM role are provisioned externally
  # (tanayseven/personal-cloud); nothing here creates AWS resources.
  #
  # The role's trust policy only accepts
  # `repo:tanayseven/tabletop-tavern:ref:refs/heads/main`, so this cannot run
  # from a pull request or any other branch -- hence the `if` below.
  deploy:
    needs: [web, desktop]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Required to mint the OIDC token that configure-aws-credentials exchanges
      # for the role. Without it the assume-role step fails.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-for-tabletop-tavern'
          aws-region: us-east-1

      # No CloudFront invalidation: the role is scoped to S3 only, so updates
      # serve stale from the edge until the cache TTL expires.
      - name: Deploy to S3
        run: aws s3 cp --recursive dist/ s3://tabletoptavern.tanay.tech/
