name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app itself is platform-independent, so this runs on Linux only. The old
  # three-OS matrix existed because the Bevy binary had to compile everywhere;
  # what actually varies per OS now is the Tauri shell, covered by `desktop`.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Catches breakage in the Tauri shell, which the `web` job never exercises.
  # Only builds the Rust side -- bundling is the release workflow's job.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri's Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      # tauri.conf.json points at ../dist, and `tauri build` would run it
      # anyway; building first keeps the failure attributable to the frontend.
      - name: Build the frontend
        run: pnpm build

      - name: Check the Tauri shell
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
