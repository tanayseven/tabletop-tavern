[package]
name = "tabletop_tavern"
version = "0.2.0"
edition = "2024"

[dependencies]
bevy = "0.19"
rand = "0.10"

# getrandom (rand's underlying entropy source) has no default backend on wasm32-unknown-unknown;
# it must be told explicitly to use the browser's Web Crypto API via wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# Bevy's recommended dev-build settings: keep our own code unoptimized for fast
# incremental compiles, but optimize dependencies (which rarely change) so the
# game still runs at a usable frame rate during development.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
