<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A collection of tabletop games." />
    <title>Tabletop Tavern</title>
    <!-- The only place a colour is written outside app.css: this runs before the
         stylesheet loads, so it can't reference a token. It mirrors
         --tavern-bg in both modes, so there is no flash of the wrong
         background before Svelte mounts. `theme.test.ts` pins the two
         together. -->
    <style>
      html {
        background: #f5e9d3;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #1e1712;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
