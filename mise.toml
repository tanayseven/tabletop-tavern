[settings]
# Fail instead of silently updating mise.lock when versions drift,
# so every clone/CI run resolves to exactly what's pinned.
lockfile = true
experimental = true

[tools]
# Node + pnpm build and test the Svelte app; this is the toolchain you use day to day.
node = "24.21.0"
pnpm = "12.4.0"
# Tauri's shell is written in Rust, so a toolchain is still needed to produce desktop and
# mobile bundles. Nothing in `src/` is Rust — this is a build-time dependency of packaging
# only, and you never edit Rust to add a game.
rust = "1.97.1"
# itch.io's official CLI for pushing game builds to itch.io from the command line.
"ubi:itchio/butler" = "15.30.0"

[tasks.dev]
description = "Run the app in a browser with hot reload"
run = "pnpm dev"

[tasks.build]
description = "Build the web app into dist/"
run = "pnpm build"

[tasks.test]
description = "Run the unit and component test suite"
run = "pnpm test"

[tasks.check]
description = "Lint, format-check and typecheck everything"
run = ["pnpm lint", "pnpm check"]

[tasks.tauri]
description = "Run the desktop app (pass `build` to produce bundles)"
run = "pnpm tauri"
